<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<title>Lilac Fret Web V3.03</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Jersey+15&family=Barlow:wght@400;600&display=swap">
<style>
/* Layout: the plugin's V3 art skin. A 4096x2160 stage (baked background, dial frame
   sequences, LED matrix) scaled to the window; the live neck, CHORDS and PROGRESSION
   panels sit in the bubble rect where the plugin puts them. Single dark look, like the plugin. */
@font-face { font-family: "Jersey 10"; src: url(assets/Jersey10-Regular.ttf) format("truetype"); font-display: swap; }
@font-face { font-family: "Jersey 15"; src: url(assets/Jersey15-Regular.ttf) format("truetype"); font-display: swap; }
@font-face { font-family: "Barlow"; src: url(assets/Barlow-Regular.ttf) format("truetype"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Barlow"; src: url(assets/Barlow-SemiBold.ttf) format("truetype"); font-weight: 600; font-display: swap; }
:root {
  color-scheme: dark;
  --bg: #0b0910;  --panel: #1b1626; --panel-brd: #2a2438; --board: #221c2e; --card: #151020;
  --fg: #e8e4f0;  --mut: #8a8496;   --dim: #6e6880;
  --lilac: #b18cff; --root: #4cc3e8; --gold: #ffd166; --rose: #ff6f91; --quality: #f2b63c; --ext: #e75fa8;
  --teal: #3fd2c7; --green: #7dff9a; --red: #ff5f5f; --dot-text: #17141d;
  --nut: #d6cfe6; --strings: #746d88; --wire: #453f58; --hair: #3a3450;
}
html, body { background: var(--bg); color: var(--fg); margin: 0; }
body { font-family: "Barlow", "Helvetica Neue", Arial, sans-serif;
       padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.scroller { overflow-x: auto; }
#stage { position: relative; width: max(100%, 980px); aspect-ratio: 4096 / 2160; margin: 0 auto; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
#chrome { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.hit { position: absolute; opacity: 0; cursor: pointer; font-size: 16px; appearance: none; -webkit-appearance: none; border: 0; background: none; }
.hit:focus-visible { opacity: .25; outline: 2px solid var(--lilac); }
#error { position: absolute; inset: 40% 20% auto; text-align: center; color: var(--fg); background: var(--panel); border: 1px solid var(--panel-brd); border-radius: 10px; padding: 14px; }

#bubble { position: absolute; display: flex; flex-direction: column; }
#neck { display: block; width: 100%; touch-action: manipulation; cursor: pointer; }
#bottom { display: flex; min-height: 0; }
.panel { background: var(--panel); border: 1px solid var(--panel-brd); border-radius: 10px; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
#chordsPanel { flex: 56 1 0; } #progPanel { flex: 44 1 0; }
.head { display: flex; align-items: center; gap: 5px; padding: 7px 9px 3px; min-width: 0; overflow-x: auto; scrollbar-width: none; white-space: nowrap; }
.head::-webkit-scrollbar { display: none; }
.title { font: 600 13px/1.2 "Barlow", sans-serif; color: var(--fg); flex: 1 1 auto; min-width: 60px; overflow: hidden; text-overflow: ellipsis; }
.title span { color: var(--mut); font-weight: 400; }
.live { font: 15px/1 "Jersey 15", monospace; color: #e5d9ff; }
.pill { font: 500 12px/1 "Barlow", sans-serif; color: var(--mut); background: #221c30; border: 1px solid var(--panel-brd); border-radius: 999px; padding: 5px 10px; cursor: pointer; flex: 0 0 auto; }
.pill[aria-pressed="true"], .pill.on { background: var(--lilac); color: var(--dot-text); border-color: var(--lilac); }
.pill:disabled { opacity: .35; cursor: default; }
select.pill { padding-right: 22px; appearance: none; -webkit-appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--mut) 50%), linear-gradient(135deg, var(--mut) 50%, transparent 50%);
  background-position: calc(100% - 12px) 52%, calc(100% - 8px) 52%; background-size: 4px 4px; background-repeat: no-repeat; max-width: 170px; }
.rank { font: 12px/1 "Barlow", sans-serif; color: var(--mut); font-variant-numeric: tabular-nums; }
.pill:focus-visible, .card:focus-visible, .mini:focus-visible { outline: 2px solid var(--lilac); outline-offset: 2px; }
input.name { font: 13px "Barlow", sans-serif; color: var(--fg); background: var(--card); border: 1px solid var(--lilac); border-radius: 6px; padding: 4px 8px; width: 150px; }
.strip { flex: 1; min-height: 0; overflow-x: auto; overflow-y: hidden; display: flex; gap: 7px; padding: 4px 9px 9px; align-items: stretch; position: relative; }
.empty { color: var(--dim); font-size: 13px; align-self: center; padding: 0 6px; white-space: normal; }
.card { flex: 0 0 auto; background: var(--card); border: 1px solid var(--panel-brd); border-radius: 12px; display: flex; flex-direction: column; cursor: pointer; position: relative; touch-action: pan-x; }
.card.sel { border-color: var(--lilac); box-shadow: 0 0 0 1px var(--lilac) inset; }
.card.playing { border-color: var(--root); box-shadow: 0 0 0 1px var(--root) inset; }
.card.dragging { opacity: .85; z-index: 2; box-shadow: 0 6px 18px rgba(0,0,0,.5); }
.card canvas { display: block; flex: 1; min-height: 0; width: 100%; }
.mini { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--panel-brd); background: #221c30; color: var(--fg); font: 600 14px/1 "Barlow", sans-serif; padding: 0; cursor: pointer; display: grid; place-items: center; }
.mini.add { color: var(--lilac); }
.info { flex: 1 1 auto; min-width: 160px; font-size: 13px; line-height: 1.45; color: #cfc8dc; white-space: normal; align-self: flex-start; padding-top: 4px; }
.info b { color: var(--fg); font-weight: 600; } .info .out { color: var(--rose); } .info .ok { color: var(--green); }
.ver { text-align: center; margin: 0; padding: 4px 0 10px; font: 12px/1 "Barlow", sans-serif; color: var(--dim); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="scroller">
  <div id="stage">
    <canvas id="chrome"></canvas>

    <!-- invisible hit zones over the baked chrome (same rects as the plugin's resized()) -->
    <select class="hit" id="scaleSel"  aria-label="Scale"    data-r="1600,88,715,190"></select>
    <select class="hit" id="tuningSel" aria-label="Tuning"   data-r="1600,282,715,190"></select>
    <select class="hit" id="rootSel"   aria-label="Root"     data-r="2530,203,140,140"></select>
    <select class="hit" id="posSel"    aria-label="Position" data-r="2976,244,140,140"></select>
    <button class="hit" id="par0" aria-label="Parallel scale 1 on/off" data-r="3324,66,140,140"></button>
    <button class="hit" id="par1" aria-label="Parallel scale 2 on/off" data-r="3324,284,140,140"></button>
    <select class="hit" id="par0Sel" aria-label="Parallel scale 1" data-r="3480,66,545,190"></select>
    <select class="hit" id="par1Sel" aria-label="Parallel scale 2" data-r="3480,284,545,190"></select>

    <div id="bubble">
      <canvas id="neck" aria-label="Fretboard"></canvas>
      <div id="bottom">
        <div class="panel" id="chordsPanel">
          <div class="head" id="chordsHead"></div>
          <div class="strip" id="chordStrip"></div>
        </div>
        <div class="panel" id="progPanel">
          <div class="head" id="progHead"></div>
          <div class="strip" id="progStrip"></div>
        </div>
      </div>
    </div>
    <div id="error" hidden></div>
  </div>
</div>
<p class="ver">Lilac Fret V3.03</p>

<script>
(() => {
  // ================= V3 layout: numbers straight from Source/PluginEditor.cpp (namespace v3) =================
  const V = {
    W: 4096, H: 2160,
    mqX: 100, mqRight: 1520, mqBaseline: 400, mqFontPx: 505, mqClipY: 60, mqClipH: 420, mqPad: 14, mqWrapGap: 320,
    scaleLabelX: 2253.47, scaleLabelY: 154.61, scaleValX: 2254.89, scaleValY: 237.82,
    tunLabelX: 1668.47, tunLabelY: 331.61, tunValX: 1669.89, tunValY: 414.82, screenValMaxW: 620,
    lDial: [2203.01, 81.03, 602, 389], rDial: [2845.4, 79.23, 664, 401],
    lTextX: 2602, lTextY: 309.95, lRingCx: 2600, lRingCy: 273, lRingOuterR: 195,
    rTextX: 3046, rTextY: 313.95, rRingCx: 3046, rRingCy: 314, rRingR: 150, dialTextPx: 140, dialTextMaxW: 240,
    ledCx: 3393.76, ledCy: [135.82, 353.82], ledW: 124, ledH: 106,
    parLabelX: 3540.65, parLabelY: [133.61, 355.65], parValX: 3751.71, parValY: [216.82, 438.86], parValMaxW: 500,
    bub: [131.4, 605.6, 3833.3, 1368.8],
  };
  const COL = { grey: '#b2b2b2', gold: '#c4a105', cyan: '#08b8ff', yellow: '#ffd400', blue: '#78aeff', pink: '#ff78ce' };
  // Parallel slot colours. Slot 2 is rose (the plugin's third overlay colour) instead of amber:
  // amber read the same as the gold scale name on the screen.
  const OVERLAY = ['#3fd2c7', '#ff6f91'];
  const FLAVOURS = ['triad', '7', '9', '6', 'sus2', 'sus4'];
  const NFRETS = 15, MAX_STEPS = 16;
  const DEG = ['1','b2','2','b3','3','4','b5','5','b6','6','b7','7'];
  const $ = id => document.getElementById(id);
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // ================= engine (fret.wasm = Source/FretEngine.cpp + PitchTracker.h + web/fret_wasm.cpp) =================
  let E = null;
  const read = p => new TextDecoder().decode(new Uint8Array(E.memory.buffer, p, E.fret_len()));
  const call = (fn, ...a) => JSON.parse(read(E[fn](...a)));

  // ================= state (FretViewState) =================
  const st = {
    root: 9, scale: 1, tuning: 0, pos: -1, sevenths: false, degrees: false, sound: true,
    overlays: [{ on: false, scale: 2 }, { on: false, scale: 5 }],
    degreeFlavour: Array(12).fill(-1), chosenGrips: {},
    progression: [], progRank: 0, libName: '', libKey: null,
    customMode: false, customFrets: [],
    // transient
    selChord: -1, selGrip: -1, progShown: -1, progEdit: -1, playing: -1,
    meta: null, scaleInfo: null, ovInfo: [null, null], chords: [], grips: [], prog: null,
  };
  const PERSIST = ['root','scale','tuning','pos','sevenths','degrees','sound','overlays','degreeFlavour','chosenGrips','progression','progRank','libName','libKey','customMode','customFrets'];
  try { const s = JSON.parse(localStorage.getItem('fretweb4') || '{}'); for (const k of PERSIST) if (k in s) st[k] = s[k]; } catch (e) {}
  const save = () => { try { const o = {}; for (const k of PERSIST) o[k] = st[k]; localStorage.setItem('fretweb4', JSON.stringify(o)); } catch (e) {} };

  // ================= library: factory presets (Lilac's chord presets) + saved progressions =================
  // Steps: {k:0, deg, flav} diatonic | {k:1, off, mask} literal chord (root offset from key, offset mask)
  //        | {k:2, frets} custom shape. Any step may carry lock:[frets].
  const T = (deg) => ({ k: 0, deg, flav: 0 }), S7 = (deg) => ({ k: 0, deg, flav: 1 });
  const DOM7 = off => ({ k: 1, off, mask: (1 << 0) | (1 << 4) | (1 << 7) | (1 << 10) });   // literal secondary dominant
  const FACTORY = [
    { name: 'Autumn Leaves',      root: 7, scale: 1, steps: [S7(3), S7(6), S7(2), S7(5), S7(1), DOM7(7), S7(0)] },
    { name: 'Fly Me to the Moon', root: 0, scale: 0, steps: [S7(5), S7(1), S7(4), S7(0), S7(3), S7(6), DOM7(4), S7(5)] },
    { name: 'Blue Bossa',         root: 0, scale: 1, steps: [S7(0), S7(3), S7(1), DOM7(7), S7(0)] },
    { name: 'Four Chords (Axis)', root: 0, scale: 0, steps: [T(0), T(4), T(5), T(3)] },
    { name: '50s Doo-Wop',        root: 0, scale: 0, steps: [T(0), T(5), T(3), T(4)] },
    { name: 'Pachelbel Canon',    root: 0, scale: 0, steps: [T(0), T(4), T(5), T(2), T(3), T(0), T(3), T(4)] },
  ];
  const loadLib = () => { try { const v = JSON.parse(localStorage.getItem('fretweb-library') || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; } };
  const saveLib = lib => { try { localStorage.setItem('fretweb-library', JSON.stringify(lib)); } catch (e) {} };
  let saving = false;   // inline "save as" field open

  // ================= images =================
  const img = src => new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
  const IMG = {};
  const FRAMES = { left: { n: 24, w: 301, h: 194 }, right: { n: 25, w: 332, h: 200 } };

  // ================= sound: Karplus-Strong, same recipe as Source/PluckSynth.h =================
  let ctx = null, master = null, live = [], unlockEl = null;
  function silentWav() {   // iOS/iPadOS: a looping silent <audio> moves the page off the ringer channel
    const n = 2000, b = new Uint8Array(44 + n), v = new DataView(b.buffer), w = (o, s) => [...s].forEach((c, i) => b[o + i] = c.charCodeAt(0));
    w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true); w(36, 'data'); v.setUint32(40, n, true);
    b.fill(128, 44); let s = ''; b.forEach(x => s += String.fromCharCode(x)); return 'data:audio/wav;base64,' + btoa(s);
  }
  function audio() {
    if (!unlockEl) {
      try { if (navigator.audioSession && navigator.audioSession.type !== 'play-and-record') navigator.audioSession.type = 'playback'; } catch (e) {}
      try { unlockEl = new Audio(silentWav()); unlockEl.loop = true; unlockEl.setAttribute('playsinline', ''); unlockEl.play().catch(() => {}); } catch (e) {}
    }
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.5;
      const comp = ctx.createDynamicsCompressor(); master.connect(comp); comp.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
  }
  const cache = new Map();
  function pluckBuffer(midi) {
    if (cache.has(midi)) return cache.get(midi);
    const sr = ctx.sampleRate, f = 440 * Math.pow(2, (midi - 69) / 12);
    const len = Math.floor(sr * 3.2), out = new Float32Array(len);
    const D = sr / f - 0.5, N = Math.max(2, Math.floor(D)), frac = Math.min(.95, Math.max(.05, D - N));
    const C = (1 - frac) / (1 + frac), decay = Math.pow(0.001, 1 / (f * 4.0));
    const buf = new Float32Array(N); let lp = 0, mean = 0;
    for (let i = 0; i < N; i++) { lp += 0.75 * (Math.random() * 2 - 1 - lp); buf[i] = lp; mean += lp; }
    mean /= N; for (let i = 0; i < N; i++) buf[i] -= mean;
    let pos = 0, last = 0, x1 = 0, y1 = 0;
    for (let i = 0; i < len; i++) {
      const x = buf[pos], avg = 0.5 * (x + last); last = x;
      const ap = C * avg + x1 - C * y1; x1 = avg; y1 = ap;
      buf[pos] = ap * decay; if (++pos >= N) pos = 0;
      out[i] = x * 0.6;
    }
    for (let i = 0; i < 256; i++) out[len - 1 - i] *= i / 256;
    const ab = ctx.createBuffer(1, len, sr); ab.copyToChannel(out, 0);
    cache.set(midi, ab); return ab;
  }
  function play(midi, when, vel) {
    const src = ctx.createBufferSource(); src.buffer = pluckBuffer(midi);
    const g = ctx.createGain(); g.gain.value = vel; src.connect(g); g.connect(master); src.start(ctx.currentTime + when);
    live.push(g); src.onended = () => { live = live.filter(x => x !== g); };
  }
  function pluck(midi) { if (!st.sound) return; audio(); play(midi, 0, 0.8); }
  function strum(notes) {
    if (!st.sound || !notes.length) return; audio();
    const t = ctx.currentTime; for (const g of live) { g.gain.cancelScheduledValues(t); g.gain.setTargetAtTime(0, t, 0.03); } live = [];
    notes.forEach((m, i) => play(m, 0.005 + i * 0.028, 0.75));
  }

  // ================= derived data (refreshAll) =================
  const openMidi = () => st.meta.tunings[st.tuning].open;
  const nStr = () => openMidi().length;
  const names = () => st.scaleInfo.names;
  const nm = pc => names()[((pc % 12) + 12) % 12];
  const inWindow = (g, pos) => pos === 0 ? g.base <= 2 : Math.abs(g.base - pos) <= 2;   // gripInWindow()
  const flavourOf = d => st.degreeFlavour[d] >= 0 ? st.degreeFlavour[d] : (st.sevenths ? 1 : 0);
  const gripKey = c => c.name + '|' + st.tuning;
  const sameFrets = (a, b) => a && b && a.length === b.length && a.every((v, i) => v === b[i]);
  const gripNotes = g => g.frets.map((f, s) => f < 0 ? null : openMidi()[s] + f).filter(n => n !== null);
  function pickGripIdx(c) {   // saved pick, then best shape in the position window, then best overall
    const ch = st.chosenGrips[gripKey(c)];
    if (ch) { const k = c.grips.findIndex(g => sameFrets(g.frets, ch)); if (k >= 0) return k; }
    if (st.pos >= 0) { const k = c.grips.findIndex(g => inWindow(g, st.pos)); if (k >= 0) return k; }
    return 0;
  }
  function solveProg() {
    st.prog = null;
    const nDeg = st.chords.length;
    st.progression = st.progression.filter(p => p.k !== 0 || p.deg < nDeg);   // degree gone after a scale change
    if (!st.progression.length) return;
    const ib = new Int32Array(E.memory.buffer, E.fret_inbuf(), 4096);
    st.progression.forEach((p, i) => {
      const o = i * 20; ib.fill(-1, o, o + 20);
      ib[o] = p.k; ib[o + 1] = p.k === 0 ? p.deg : p.k === 1 ? p.off : 0; ib[o + 2] = p.k === 0 ? p.flav : p.k === 1 ? p.mask : 0;
      if (p.lock) for (let s = 0; s < 8; s++) ib[o + 4 + s] = s < p.lock.length ? p.lock[s] : -1; else ib[o + 4] = -9;
      if (p.k === 2) for (let s = 0; s < 8; s++) ib[o + 12 + s] = s < p.frets.length ? p.frets[s] : -1;
    });
    const r = call('fret_progression', st.progression.length, st.root, st.scale, st.tuning, st.pos);
    r.steps.forEach((s, i) => { if (st.progression[i].lock && s.lock < 0) delete st.progression[i].lock; });   // stale lock
    st.progRank = Math.max(0, Math.min(r.solutions.length - 1, st.progRank));
    st.prog = r;
  }
  const progGrip = i => { const p = st.prog; if (!p || !p.solutions.length) return null; return p.steps[i].grips[p.solutions[st.progRank].idx[i]]; };

  function selectedGripFrets() {   // what the neck spotlights (plugin's selectedGripFrets())
    if (!st.customMode && st.progEdit >= 0) { const g = progGrip(st.progEdit); return g ? g.frets : null; }
    if (st.customMode) return st.customFrets.some(f => f >= 0) ? st.customFrets : null;
    if (st.playing >= 0) { const g = progGrip(st.playing); return g ? g.frets : null; }
    if (st.progShown >= 0) { const g = progGrip(st.progShown); return g ? g.frets : null; }
    if (st.selChord >= 0 && st.selGrip >= 0 && st.grips[st.selGrip]) return st.grips[st.selGrip].frets;
    return null;
  }

  function refresh() {
    st.scaleInfo = call('fret_scale', st.root, st.scale);
    st.ovInfo = st.overlays.map(o => o.on ? call('fret_scale', st.root, o.scale) : null);
    const nDeg = call('fret_chords', st.root, st.scale, 0, st.tuning, 0).length;
    st.chords = [...Array(nDeg)].map((_, d) => call('fret_chord', st.root, st.scale, d, flavourOf(d), st.tuning, 24));
    if (st.selChord >= nDeg) { st.selChord = -1; st.selGrip = -1; }
    if (st.customFrets.length !== nStr()) st.customFrets = Array(nStr()).fill(-1);
    solveProg();
    if (st.progEdit >= st.progression.length) st.progEdit = -1;
    if (st.progShown >= st.progression.length) st.progShown = -1;
    // grips list for the variants view / chooser
    if (st.progEdit >= 0 && st.prog) st.grips = orderByWindow(st.prog.steps[st.progEdit].grips);
    else if (st.selChord >= 0) st.grips = orderByWindow(st.chords[st.selChord].grips);
    else st.grips = [];
    save(); syncHits(); drawChrome(); drawNeck(); renderChords(); renderProg(); resetMarquee();
  }
  const orderByWindow = gs => st.pos < 0 ? gs.slice() : gs.filter(g => inWindow(g, st.pos)).concat(gs.filter(g => !inWindow(g, st.pos)));

  // ================= stage sizing =================
  const stage = $('stage'), chrome = $('chrome');
  let S = 1;   // CSS px per canvas unit
  function layout() {
    const w = stage.clientWidth; S = w / V.W;
    document.querySelectorAll('[data-r]').forEach(el => {
      const [x, y, rw, rh] = el.dataset.r.split(',').map(Number);
      Object.assign(el.style, { left: x * S + 'px', top: y * S + 'px', width: rw * S + 'px', height: rh * S + 'px' });
    });
    // bubble interior: plugin's resized() — reduced (56, 36), neck flex 1.55 : bottom row 1
    const [bx, by, bw, bh] = V.bub, rx = 56 * S, ry = 36 * S, gap = Math.max(6, 26 * S);
    Object.assign($('bubble').style, { left: (bx * S + rx) + 'px', top: (by * S + ry) + 'px', width: (bw * S - 2 * rx) + 'px', height: (bh * S - 2 * ry) + 'px', gap: gap + 'px' });
    $('bottom').style.gap = gap + 'px';
    const inner = bh * S - 2 * ry - gap;
    $('neck').style.height = Math.round(inner * 1.55 / 2.55) + 'px';

  function drawDiagram(cv, grip, rootPc, title, sub) {
    const dpr = Math.min(2, window.devicePixelRatio || 1), w = cv.clientWidth, h = cv.clientHeight;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
    g.textBaseline = 'alphabetic'; g.textAlign = 'left';
    let tx = 9;
    if (sub) { g.font = `${Math.max(13, Math.min(20, h * 0.11))}px "Jersey 15", monospace`; g.fillStyle = css('--lilac'); g.fillText(sub, tx, 20); tx += g.measureText(sub + ' ').width + 2; }
    g.fillStyle = css('--fg'); g.font = `600 ${Math.max(11, Math.min(15, h * 0.085))}px Barlow, sans-serif`;
    let t = title; while (t.length > 1 && tx + g.measureText(t).width > w - 30) t = t.slice(0, -1); g.fillText(t === title ? t : t + '…', tx, 20);
    if (!grip) { g.fillStyle = css('--mut'); g.font = '12px Barlow'; g.fillText('no shape', 9, h / 2); return; }
    const fr = grip.frets, n = fr.length, maxF = Math.max(...fr), open = maxF <= 4;
    const minF = Math.min(...fr.filter(f => f > 0).concat([99]));
    const start = open ? 1 : (grip.base || (minF < 99 ? minF : 1));
    const L = w * 0.13, R = w * (open ? 0.87 : 0.76), T = 44, B = h - 6, cw = (R - L) / (n - 1), rh = (B - T) / 4;
    g.strokeStyle = css('--hair'); g.lineWidth = 1;
    for (let s = 0; s < n; s++) { g.beginPath(); g.moveTo(L + s * cw, T); g.lineTo(L + s * cw, B); g.stroke(); }
    for (let k = 0; k <= 4; k++) { g.beginPath(); g.moveTo(L, T + k * rh); g.lineTo(R, T + k * rh); g.stroke(); }
    if (open) { g.fillStyle = css('--nut'); g.fillRect(L - 1, T - 3, R - L + 2, 4); }
    else { g.fillStyle = '#cfc8dc'; g.font = '14px "Jersey 15", monospace'; g.fillText(start + 'fr', R + 5, T + rh * 0.5 + 5); }
    const dr = Math.min(9, cw * 0.44, rh * 0.44);
    if (grip.barre) {
      const y = T + rh * (grip.barreFret - start + 0.5);
      g.fillStyle = 'rgba(177,140,255,.5)'; g.beginPath(); g.roundRect(L + grip.barreFrom * cw - 6, y - 6, (n - 1 - grip.barreFrom) * cw + 12, 12, 6); g.fill();
    }
    g.textAlign = 'center';
    fr.forEach((f, s) => {
      const x = L + s * cw;
      if (f < 0) { g.fillStyle = css('--rose'); g.font = '13px "Jersey 15", monospace'; g.fillText('x', x, T - 6); return; }
      if (f === 0) { g.strokeStyle = css('--mut'); g.lineWidth = 1.2; g.beginPath(); g.arc(x, T - 10, 3.5, 0, 7); g.stroke(); return; }
      if (f - start > 3) return;
      const pc = (openMidi()[s] + f) % 12, y = T + rh * (f - start + 0.5);
      g.fillStyle = pc === rootPc ? css('--root') : css('--lilac'); g.beginPath(); g.arc(x, y, dr, 0, 7); g.fill();
    });
  }
  function makeCard(box, { grip, root, title, sub, sel, onTap, onAdd, onRemove, locked }) {
    const h = box.clientHeight - 13, cw = Math.max(92, Math.min(180, h * 0.8));
    const c = document.createElement('div'); c.className = 'card' + (sel ? ' sel' : ''); c.tabIndex = 0;
    c.style.width = cw + 'px'; c.setAttribute('role', 'button'); c.setAttribute('aria-label', (sub ? sub + ' ' : '') + title);
    c.innerHTML = '<canvas></canvas>';
    if (onAdd) { const b = document.createElement('button'); b.className = 'mini add'; b.textContent = '+'; b.title = 'Add to progression'; b.setAttribute('aria-label', 'Add ' + title + ' to the progression'); b.onclick = e => { e.stopPropagation(); onAdd(); }; c.appendChild(b); }
    if (onRemove) { const b = document.createElement('button'); b.className = 'mini'; b.textContent = '×'; b.setAttribute('aria-label', 'Remove step'); b.onclick = e => { e.stopPropagation(); onRemove(); }; c.appendChild(b); }
    if (locked) { const l = document.createElement('span'); l.textContent = '●'; l.title = 'Fretting locked'; Object.assign(l.style, { position: 'absolute', left: '8px', bottom: '4px', color: 'var(--lilac)', fontSize: '9px' }); c.appendChild(l); }
    c.onclick = onTap; c.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onTap(); } };
    box.appendChild(c);
    drawDiagram(c.querySelector('canvas'), grip, root, title, sub);
    return c;
  }
  function pill(label, { pressed, on, disabled, onClick, title } = {}) {
    const b = document.createElement('button'); b.className = 'pill'; b.textContent = label;
    if (pressed !== undefined) b.setAttribute('aria-pressed', String(!!pressed));
    if (on) b.classList.add('on'); if (disabled) b.disabled = true; if (title) b.title = title;
    b.onclick = onClick; return b;
  }

  // ================= CHORDS panel: overview / variants / custom / progression-step chooser =================
  function addStep(step) {
    if (st.progression.length >= MAX_STEPS) { flash('The progression is full (16 steps).'); return; }
    st.progression.push(step); st.progRank = 0; st.libName = ''; st.libKey = null; refresh();
  }
  function renderChords() {
    const head = $('chordsHead'), box = $('chordStrip'); head.textContent = ''; box.textContent = '';
    const title = document.createElement('div'); title.className = 'title';
    const right = [
      pill('Custom', { pressed: st.customMode, onClick: () => { st.customMode = !st.customMode; if (st.customMode) { st.selChord = st.selGrip = -1; st.progEdit = -1; } refresh(); } }),
      pill('Degrees', { pressed: st.degrees, onClick: () => { st.degrees = !st.degrees; save(); drawNeck(); renderChords(); } }),
      pill('7ths', { pressed: st.sevenths, onClick: () => { st.sevenths = !st.sevenths; st.selGrip = -1; refresh(); } }),
      pill('Sound', { pressed: st.sound, onClick: () => { st.sound = !st.sound; save(); renderChords(); } }),
    ];

    if (st.customMode) {
      const placed = st.customFrets.some(f => f >= 0);
      head.append(title, pill('Clear', { disabled: !placed, onClick: () => { st.customFrets.fill(-1); save(); drawNeck(); renderChords(); } }));
      if (placed) head.append(pill('+ progression', { onClick: () => addStep({ k: 2, frets: st.customFrets.slice(), lock: st.customFrets.slice() }) }));
      head.append(...right);
      if (!placed) { title.innerHTML = 'Custom chord <span>&middot; tap notes onto the neck</span>'; box.innerHTML = '<p class="empty">Tap one note per string on the neck. Fret names the chord and relates it to the scale.</p>'; return; }
      let mask = 0, bass = -1, minF = 0;
      st.customFrets.forEach((f, s) => { if (f < 0) return; const pc = (openMidi()[s] + f) % 12; mask |= 1 << pc; if (bass < 0) bass = pc; if (f > 0 && (!minF || f < minF)) minF = f; });
      const r = call('fret_recognize', mask, bass, st.root, st.tuning, 0), root = r.chord.root >= 0 ? r.chord.root : bass;
      title.innerHTML = `${esc(r.chord.name)} <span>&middot; ${esc(r.roman)} in ${esc(nm(st.root))} ${esc(st.meta.scales[st.scale])}</span>`;
      makeCard(box, { grip: { frets: st.customFrets, base: minF || 1 }, root, title: r.chord.name, onTap: () => strum(gripNotes({ frets: st.customFrets })),
                      onAdd: () => addStep({ k: 2, frets: st.customFrets.slice(), lock: st.customFrets.slice() }) });
      const tones = [], outside = [];
      for (let off = 0; off < 12; off++) { const pc = (root + off) % 12; if (!((mask >> pc) & 1)) continue; const l = off === 0 ? 'R' : DEG[off]; tones.push(l); if (!((st.scaleInfo.mask >> pc) & 1)) outside.push(`${l} (${nm(pc)})`); }
      const fits = []; for (let i = 0; i < st.meta.scales.length && fits.length < 4; i++) { if (i === st.scale) continue; const m = scaleMask(i); if ((m & mask) === mask) fits.push(st.meta.scales[i]); }
      const info = document.createElement('div'); info.className = 'info';
      info.innerHTML = `<b>Tones:</b> ${tones.join('  ')}<br>${outside.length ? `<span class="out">Outside the scale: ${esc(outside.join(', '))}</span>` : '<span class="ok">All in the scale</span>'}<br><b>Also fits (same root):</b> ${fits.length ? esc(fits.join(', ')) : 'nothing else'}`;
      box.appendChild(info); return;
    }

    if (st.progEdit >= 0 && st.prog) {   // shape chooser for one progression step
      const step = st.prog.steps[st.progEdit], cur = progGrip(st.progEdit);
      head.append(pill('← progression', { onClick: () => { st.progEdit = -1; refresh(); } }), title, ...right);
      title.innerHTML = `Step ${st.progEdit + 1}: ${esc(step.name)} <span>&middot; tap a shape to lock it (the current one again unlocks)</span>`;
      st.grips.forEach(gr => makeCard(box, { grip: gr, root: step.root, title: step.name, sel: cur && sameFrets(gr.frets, cur.frets), onTap: () => {
        const p = st.progression[st.progEdit]; strum(gripNotes(gr));
        if (p.lock && sameFrets(p.lock, gr.frets)) delete p.lock; else p.lock = gr.frets.slice();
        st.progShown = st.progEdit; st.progEdit = -1; st.libName = ''; st.libKey = null; refresh();
      } }));
      return;
    }

    if (st.selChord >= 0) {   // variants view: flavour chips + every fretting of the chord
      const c = st.chords[st.selChord];
      head.append(pill('← all chords', { onClick: () => { st.selChord = st.selGrip = -1; refresh(); } }));
      FLAVOURS.forEach((f, i) => head.append(pill(f, { pressed: flavourOf(st.selChord) === i, onClick: () => { st.degreeFlavour[st.selChord] = i; st.selGrip = 0; refresh(); } })));
      head.append(title, ...right);
      title.innerHTML = `${esc(c.name)} <span>&middot; ${st.grips.length} shapes</span>`;
      st.grips.forEach((gr, i) => makeCard(box, { grip: gr, root: c.root, title: c.name, sub: c.roman, sel: i === st.selGrip,
        onTap: () => { strum(gripNotes(gr)); st.selGrip = st.selGrip === i ? -1 : i; if (st.selGrip >= 0) st.chosenGrips[gripKey(c)] = gr.frets.slice(); save(); drawNeck(); renderChords(); },
        onAdd: () => addStep({ k: 0, deg: st.selChord, flav: flavourOf(st.selChord), lock: gr.frets.slice() }) }));
      return;
    }

    head.append(title, ...right);   // overview: one best grip per diatonic chord
    title.innerHTML = 'Chords in this scale <span>&middot; tap for frettings, + adds to the progression</span>';
    st.chords.forEach((c, i) => {
      const gr = c.grips[pickGripIdx(c)];
      makeCard(box, { grip: gr, root: c.root, title: c.name, sub: c.roman,
        onTap: () => { if (gr) strum(gripNotes(gr)); st.selChord = i; st.selGrip = 0; st.progShown = -1; refresh(); },
        onAdd: () => addStep({ k: 0, deg: i, flav: flavourOf(i), lock: gr ? gr.frets.slice() : undefined }) });
    });
  }
  const maskCache = {};
  function scaleMask(i) { const k = st.root + ':' + i; if (!(k in maskCache)) maskCache[k] = call('fret_scale', st.root, i).mask; return maskCache[k]; }

  // ================= PROGRESSION panel: library, solver ranks, play, steps =================
  let playTimer = 0;
  function stopPlay() { clearTimeout(playTimer); if (st.playing >= 0) { st.playing = -1; drawNeck(); renderProg(); } }
  function playFrom(i) {
    if (!st.prog || !st.prog.solutions.length || i >= st.progression.length) { stopPlay(); return; }
    st.playing = i; const g = progGrip(i); if (g) strum(gripNotes(g));
    drawNeck(); document.querySelectorAll('#progStrip .card').forEach((el, k) => el.classList.toggle('playing', k === i));
    playTimer = setTimeout(() => playFrom(i + 1), 1300);
  }
  function renderProg() {
    const head = $('progHead'), box = $('progStrip'); head.textContent = ''; box.textContent = '';
    const lib = loadLib();
    // library dropdown
    const sel = document.createElement('select'); sel.className = 'pill'; sel.setAttribute('aria-label', 'Progression library');
    const own = lib.find(p => p.name === st.libName);
    // key readout: the loaded entry's name + the key it plays in now, and its original key when
    // the root dial has moved it (steps are degrees, so a turned dial transposes the progression)
    const keyName = (r, sc) => `${nm(r)} ${st.meta.scales[sc].toLowerCase()}`;
    const moved = st.libKey && (st.libKey.root !== st.root || st.libKey.scale !== st.scale);
    const label = st.libName ? `${st.libName} \u00b7 ${keyName(st.root, st.scale)}${moved ? ` (orig. ${keyName(st.libKey.root, st.libKey.scale)})` : ''}` : 'Library';
    sel.style.maxWidth = '260px';
    sel.innerHTML = `<option value="">${esc(label)}</option>`
      + `<optgroup label="Presets">${FACTORY.map((p, i) => `<option value="f${i}">${esc(p.name)}</option>`).join('')}</optgroup>`
      + (lib.length ? `<optgroup label="My progressions">${lib.map((p, i) => `<option value="u${i}">${esc(p.name)}</option>`).join('')}</optgroup>` : '')
      + `<optgroup label="Actions"><option value="save"${st.progression.length ? '' : ' disabled'}>Save as…</option>`
      + (own ? `<option value="over">Save over “${esc(own.name)}”</option><option value="del">Delete “${esc(own.name)}”</option>` : '') + '</optgroup>';
    sel.onchange = () => {
      const v = sel.value; sel.value = '';
      if (v[0] === 'f' || v[0] === 'u') {
        const p = v[0] === 'f' ? FACTORY[+v.slice(1)] : lib[+v.slice(1)];
        stopPlay(); st.root = p.root; st.scale = p.scale; st.progression = JSON.parse(JSON.stringify(p.steps));
        if (p.tuning !== undefined) st.tuning = p.tuning;
        st.progRank = 0; st.progShown = st.progEdit = -1; st.selChord = st.selGrip = -1; st.customMode = false; st.libName = p.name; st.libKey = { root: p.root, scale: p.scale };
        refresh(); if (st.prog && st.prog.solutions.length) playFrom(0);
      } else if (v === 'save') { saving = true; renderProg(); }
      else if (v === 'over' && own) { own.root = st.root; own.scale = st.scale; own.tuning = st.tuning; own.steps = JSON.parse(JSON.stringify(st.progression)); saveLib(lib); st.libKey = { root: st.root, scale: st.scale }; save(); renderProg(); flash('Saved over “' + own.name + '”.'); }
      else if (v === 'del' && own) { saveLib(lib.filter(p => p !== own)); st.libName = ''; st.libKey = null; save(); renderProg(); }
    };
    head.appendChild(sel);

    if (saving) {
      const inp = document.createElement('input'); inp.className = 'name'; inp.placeholder = 'Name'; inp.id = 'saveName'; inp.maxLength = 40;
      inp.value = `${nm(st.root)} ${st.meta.scales[st.scale]} ${lib.length + 1}`;
      const doSave = () => {
        const name = inp.value.trim(); if (!name) return;
        const l = loadLib().filter(p => p.name !== name);
        l.push({ name, root: st.root, scale: st.scale, tuning: st.tuning, steps: JSON.parse(JSON.stringify(st.progression)) });
        l.sort((a, b) => a.name.localeCompare(b.name)); saveLib(l); st.libName = name; st.libKey = { root: st.root, scale: st.scale }; saving = false; save(); renderProg();
      };
      inp.onkeydown = e => { if (e.key === 'Enter') doSave(); if (e.key === 'Escape') { saving = false; renderProg(); } };
      head.append(inp, pill('Save', { onClick: doSave }), pill('Cancel', { onClick: () => { saving = false; renderProg(); } }));
      setTimeout(() => { inp.focus(); inp.select(); }, 0);
    } else {
      const title = document.createElement('div'); title.className = 'title'; title.id = 'progTitle';
      title.innerHTML = st.progression.length ? `Progression <span>&middot; ${st.progression.length} steps in ${esc(keyName(st.root, st.scale))}</span>` : 'Progression';
      const liveLbl = document.createElement('span'); liveLbl.className = 'live'; liveLbl.id = 'liveLbl';
      head.append(title, liveLbl);
    }
    head.append(pill('Mic', { pressed: micOn, title: 'Show the note you play on the guitar', onClick: toggleMic }),
                pill('MIDI', { pressed: midiOn, title: 'Spotlight held MIDI chords; follows Launchkey scale CCs', onClick: toggleMidi }));
    const nSol = st.prog ? st.prog.solutions.length : 0;
    if (nSol > 1) {
      head.append(pill('‹', { disabled: st.progRank <= 0, onClick: () => { st.progRank--; refresh(); } }));
      const r = document.createElement('span'); r.className = 'rank'; r.textContent = `${st.progRank + 1}/${nSol}`; head.append(r);
      head.append(pill('›', { disabled: st.progRank >= nSol - 1, onClick: () => { st.progRank++; refresh(); } }));
    }
    if (st.progression.length) {
      head.append(pill(st.playing >= 0 ? '■' : '▶', { title: st.playing >= 0 ? 'Stop' : 'Play the progression', onClick: () => st.playing >= 0 ? stopPlay() : playFrom(0) }),
                  pill('Clear', { onClick: () => { stopPlay(); st.progression = []; st.progShown = st.progEdit = -1; st.progRank = 0; st.libName = ''; st.libKey = null; refresh(); } }));
    }
    updateLive();

    if (!st.progression.length) { box.innerHTML = '<p class="empty">Tap + on a chord to add it, or pick a preset from the Library.</p>'; return; }
    if (!st.prog || !nSol) { box.innerHTML = '<p class="empty">No playable fretting for this progression in this tuning.</p>'; return; }
    st.progression.forEach((p, i) => {
      const s = st.prog.steps[i];
      const card = makeCard(box, { grip: progGrip(i), root: s.root, title: s.name, sub: String(i + 1), sel: i === st.progEdit || i === st.progShown, locked: !!p.lock,
        onTap: () => { if (card.dataset.dragged) { delete card.dataset.dragged; return; } stopPlay(); const g = progGrip(i); if (g) strum(gripNotes(g));
                       st.progShown = i; st.progEdit = i; st.customMode = false; st.selChord = st.selGrip = -1; refresh(); },
        onRemove: () => { stopPlay(); st.progression.splice(i, 1); st.progShown = st.progEdit = -1; st.libName = ''; st.libKey = null; refresh(); } });
      if (i === st.playing) card.classList.add('playing');
      dragReorder(card, i, box);
    });
  }
  function dragReorder(card, i, box) {   // horizontal drag to move a step (ChordDiagram::onDragEnd)
    let x0 = 0, pid = null, moved = false;
    card.addEventListener('pointerdown', e => { if (e.target.closest('.mini')) return; x0 = e.clientX; pid = e.pointerId; moved = false; });
    card.addEventListener('pointermove', e => {
      if (pid !== e.pointerId) return; const dx = e.clientX - x0;
      if (!moved && Math.abs(dx) > 8) { moved = true; card.setPointerCapture(pid); card.classList.add('dragging'); }
      if (moved) card.style.transform = `translateX(${dx}px)`;
    });
    const end = e => {
      if (pid !== e.pointerId) return; pid = null; if (!moved) return;
      card.dataset.dragged = '1'; card.classList.remove('dragging');
      const pitch = card.offsetWidth + 7, dx = e.clientX - x0;
      const slot = Math.max(0, Math.min(st.progression.length - 1, i + Math.round(dx / pitch)));
      card.style.transform = '';
      if (slot !== i) { const [p] = st.progression.splice(i, 1); st.progression.splice(slot, 0, p); st.progShown = slot; st.progEdit = -1; st.libName = ''; st.libKey = null; refresh(); }
    };
    card.addEventListener('pointerup', end); card.addEventListener('pointercancel', end);
  }

  // ================= boot =================
  const stub = new Proxy({}, { get: () => () => 0 });   // reactor WASI module: no file/clock use
  Promise.all([
    fetch('fret.wasm').then(r => { if (!r.ok) throw new Error('fret.wasm HTTP ' + r.status); return r.arrayBuffer(); }).then(b => WebAssembly.instantiate(b, { wasi_snapshot_preview1: stub })),
    img('assets/bg.webp').then(i => IMG.bg = i), img('assets/dial_left.webp').then(i => IMG.dl = i), img('assets/dial_right.webp').then(i => IMG.dr = i),
    img('assets/parallel_on.png').then(i => IMG.par = i), img('assets/flower.png').then(i => IMG.flower = i),
  ]).then(([{ instance }]) => {
    E = instance.exports; if (E._initialize) E._initialize();
    st.meta = call('fret_meta');
    st.scale = Math.min(st.scale, st.meta.scales.length - 1); st.tuning = Math.min(st.tuning, st.meta.tunings.length - 1);
    st.overlays.forEach(o => o.scale = Math.min(o.scale, st.meta.scales.length - 1));
    layout(); wire(); refresh();
    if (document.fonts) document.fonts.ready.then(() => { drawChrome(); drawNeck(); renderChords(); renderProg(); });
  }).catch(err => { const el = $('error'); el.hidden = false; el.textContent = 'Fret could not load (' + err.message + '). Reload the page to try again.'; });
})();
</script>
